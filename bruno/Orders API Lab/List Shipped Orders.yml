info:
  name: List Shipped Orders
  type: http
  seq: 1

http:
  method: GET
  url: http://orders-api-lab.ddev.site/api/orders?per_page=200
  params:
    - name: per_page
      value: "200"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("returns 200 orders", function () {
          expect(res.getBody().data.length).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
